<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bitview 铭文平台 · Lynn Portfolio</title>
  <link rel="stylesheet" href="./preview.css" />
  <style>
    :root { --gold: #f3a51c; }
    * { box-sizing: border-box; }
    body { background:#050505; color:#f7f7f2; margin:0; font-family:Arial,"Helvetica Neue",sans-serif; }
    .case-top { align-items:center; display:flex; justify-content:space-between; left:0; padding:28px 4.5vw; position:fixed; right:0; top:0; z-index:20; }
    .case-top a,.case-lang { backdrop-filter:blur(16px); background:rgba(20,20,20,.64); border:1px solid rgba(255,255,255,.2); border-radius:999px; color:#fff; padding:14px 22px; text-decoration:none; }
    .case-lang { font-size:13px; }
    .case-hero { align-items:center; background:#050505; display:grid; grid-template-columns:minmax(360px,.9fr) minmax(520px,1.1fr); min-height:100svh; overflow:hidden; padding:120px 4.5vw 80px; position:relative; }
    .case-copy { max-width:760px; position:relative; z-index:2; }
    .case-meta { color:rgba(255,255,255,.66); font-size:15px; letter-spacing:.04em; margin-bottom:40px; }
    .case-copy h1 { font-family:Georgia,"Times New Roman",serif; font-size:clamp(58px,7vw,122px); font-style:italic; font-weight:500; letter-spacing:-.02em; line-height:.94; margin:0 0 30px; }
    .case-copy h1 span { display:block; font-family:inherit; font-style:normal; }
    .case-copy p { color:rgba(255,255,255,.7); font-size:clamp(16px,1.5vw,22px); line-height:1.6; margin:0 0 30px; max-width:700px; }
    .case-tag { border:1px solid rgba(255,255,255,.22); border-radius:999px; color:rgba(255,255,255,.8); display:inline-block; font-size:13px; padding:10px 16px; }
    .case-visual { min-height:640px; position:relative; }
    .case-visual::after { background:linear-gradient(90deg,#050505 0%,transparent 35%,rgba(0,0,0,.08) 100%); content:""; inset:0; pointer-events:none; position:absolute; z-index:1; }
    .case-visual img { height:100%; inset:0; object-fit:cover; object-position:center; position:absolute; width:100%; }
    .case-work { background:#111; padding:72px 4.5vw 120px; }
    .case-work h2 { font-size:clamp(34px,4vw,68px); font-weight:400; margin:0 auto 40px; max-width:1440px; }
    .case-pages { display:flex; flex-direction:column; gap:34px; margin:0 auto; max-width:1440px; }
    .case-pages img { background:#191919; border:1px solid rgba(255,255,255,.14); border-radius:8px; box-shadow:0 24px 60px rgba(0,0,0,.3); display:block; height:auto; width:100%; }
    .case-work { background:#000; padding:0; }
    .case-pages { gap:0; margin:0; max-width:none; }
    .case-pages img { background:transparent; border:0; border-radius:0; box-shadow:none; display:block; outline:0; width:100vw; }
    .case-pages img + img { margin-top:-2px; }
    @media (max-width:800px) { .case-top{padding:18px;} .case-work{padding:0;} .case-pages{gap:0;} .case-pages img{width:100vw;} }
  </style>
</head>
<body>
  <header class="case-top"><a href="./index.html#work">← 返回项目</a><a class="case-next" href="./index.html#work">下一个项目 →</a></header>
  <main>
    <section class="case-work"><div class="case-pages">
      <img src="./work/bitview-pages/page-01.jpg" alt="Bitview 项目页面 01" loading="lazy" /><img src="./work/bitview-pages/page-02.jpg" alt="Bitview 项目页面 02" loading="lazy" /><img src="./work/bitview-pages/page-03.jpg" alt="Bitview 项目页面 03" loading="lazy" /><img src="./work/bitview-pages/page-04.jpg" alt="Bitview 项目页面 04" loading="lazy" /><img src="./work/bitview-pages/page-05.jpg" alt="Bitview 项目页面 05" loading="lazy" /><img src="./work/bitview-pages/page-06.jpg" alt="Bitview 项目页面 06" loading="lazy" /><img src="./work/bitview-pages/page-07.jpg" alt="Bitview 项目页面 07" loading="lazy" /><img src="./work/bitview-pages/page-08.jpg" alt="Bitview 项目页面 08" loading="lazy" /><img src="./work/bitview-pages/page-09.jpg" alt="Bitview 项目页面 09" loading="lazy" /><img src="./work/bitview-pages/page-10.jpg" alt="Bitview 项目页面 10" loading="lazy" /><img src="./work/bitview-pages/page-11.jpg" alt="Bitview 项目页面 11" loading="lazy" />
    </div></section>
  </main>
</body>
</html>
